[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-smith-codex"
version = "0.3.0"
description = "Repo-local policy and multi-agent workflow integration for Codex"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Artie Hinz" }]
keywords = ["codex", "multi-agent", "agents", "orchestration"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
agent-smith = "agent_smith.cli:main"

[tool.setuptools.packages.find]
include = ["agent_smith*", "core*", "tools*", "dashboard*", "static*"]

[tool.setuptools.package-data]
agent_smith = ["templates/agent-smith/**/*.md", "templates/agent-smith/**/*.yaml"]
dashboard = ["**/*.html", "**/*.js"]
static = ["**/*.css", "**/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"
